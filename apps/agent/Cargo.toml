[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2.0.0-rc.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.26.1", features = ["v4"] }
which = "8.0.6"
zip = "8.6.0"

[build-dependencies]
tauri-build = "2.6.3"
